name: Build and Push Site Docker Image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, homelab]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Install site dependencies
        working-directory: site
        run: pnpm install --frozen-lockfile

      - name: Lint site
        working-directory: site
        run: pnpm lint

      - name: Typecheck site
        working-directory: site
        run: pnpm typecheck

      - name: Test site
        working-directory: site
        run: pnpm test

      - name: Build site
        working-directory: site
        run: pnpm build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Local Registry
        uses: docker/login-action@v4
        with:
          registry: registry.rupan.dev
          username: publisher-nix-agent-site
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Generate image tag
        id: version
        run: echo "tag=0.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: site/Dockerfile
          push: true
          tags: |
            registry.rupan.dev/apps/nix-agent-site:${{ steps.version.outputs.tag }}
            registry.rupan.dev/apps/nix-agent-site:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pin deployed image for retention
        if: github.ref == 'refs/heads/main'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$DIGEST"
          digest_hex="${DIGEST#sha256:}"
          retention_tag="retention-deployed-${digest_hex:0:16}"
          metadata="$(mktemp)"
          docker buildx imagetools create --prefer-index=false \
            --tag "registry.rupan.dev/apps/nix-agent-site:${retention_tag}" \
            --metadata-file "$metadata" "registry.rupan.dev/apps/nix-agent-site@${DIGEST}"
          python3 - "$metadata" <<'PY'
          import json
          import os
          import sys

          with open(sys.argv[1]) as handle:
              result = json.load(handle)
          assert result['containerimage.descriptor']['digest'] == os.environ['DIGEST']
          PY
          rm "$metadata"

      - name: Propose digest roll in Homelab GitOps
        if: github.ref == 'refs/heads/main'
        env:
          FORGEJO_PUBLISH_TOKEN: ${{ secrets.FORGEJO_PUBLISH_TOKEN }}
          DIGEST: ${{ steps.build.outputs.digest }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          test -n "$DIGEST"

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          CLONE_DIR="$(mktemp -d)"
          git clone --depth 1 "https://oauth2:${FORGEJO_PUBLISH_TOKEN}@git.internal:3000/JEFF7712/homelab.git" "$CLONE_DIR"
          cd "$CLONE_DIR"

          sed -i -E "s|image: registry\.rupan\.dev/apps/nix-agent-site@sha256:[a-f0-9]+|image: registry.rupan.dev/apps/nix-agent-site@${DIGEST}|" gitops/websites/nixagent/deployment.yaml

          python3 - <<'PY'
          import json
          import os

          digest = os.environ['DIGEST']
          tag = f"0.0.{os.environ['RUN_NUMBER']}"
          with open('registry/images.lock.json') as f:
              data = json.load(f)
          for img in data.get('images', []):
              if img.get('destination_repository') == 'apps/nix-agent-site':
                  img['digest'] = digest
                  img['destination_tags'] = sorted([
                      tag,
                      f"retention-{img['retention_class']}-{digest.removeprefix('sha256:')[:16]}",
                  ])
                  img['source'] = {
                      'registry': 'registry.rupan.dev',
                      'repository': 'apps/nix-agent-site',
                      'tag': tag,
                      'digest': digest,
                      'reference': f'registry.rupan.dev/apps/nix-agent-site:{tag}@{digest}',
                  }
          with open('registry/images.lock.json', 'w') as f:
              json.dump(data, f, indent=2)
              f.write('\n')
          PY

          if git diff --quiet gitops/websites/nixagent/deployment.yaml registry/images.lock.json; then
            echo "No change in image digest; GitOps repository is already up to date."
            exit 0
          fi

          branch="github-actions/roll-nix-agent-site-${GITHUB_RUN_NUMBER}"
          git checkout -b "$branch"
          git add gitops/websites/nixagent/deployment.yaml registry/images.lock.json
          git commit -m "chore(nix-agent): roll website deployment to ${DIGEST}"
          git push origin "$branch"

          curl -sf -X POST \
            -H "Authorization: token ${FORGEJO_PUBLISH_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"title\": \"chore(nix-agent): roll website deployment to ${DIGEST}\", \"head\": \"$branch\", \"base\": \"main\"}" \
            "http://git.internal:3000/api/v1/repos/JEFF7712/homelab/pulls"
